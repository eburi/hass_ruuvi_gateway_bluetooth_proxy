[project]
name = "hass_ruuvi_gateway_bluetooth_proxy"
version = "1.0.0"
description = "Home Assistant integration for Ruuvi Gateway Bluetooth Proxy"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-homeassistant-custom-component>=0.13.0",
    "homeassistant>=2024.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
